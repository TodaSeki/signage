<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stable Economy Dashboard</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #131722;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        height: 100vh;
        width: 100vw;
        gap: 4px;
        background-color: #2a2e39;
      }

      .chart-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #131722;
        overflow: hidden;
      }

      /* 中央上の大きなタイトル */
      .custom-label {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        color: #ffffff;
        font-size: 2.5vw;
        font-weight: 900;
        text-align: center;
        text-shadow:
          0 0 10px rgba(0, 0, 0, 1),
          0 0 5px rgba(0, 0, 0, 1);
        white-space: nowrap;
        pointer-events: none;
      }

      /* 背後の巨大透かし文字 */
      .watermark {
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 8vw;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.05);
        white-space: nowrap;
        z-index: 1;
        pointer-events: none;
      }

      /* 公式ウィジェットを画面枠いっぱいに広げる設定 */
      .tradingview-widget-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      .tradingview-widget-container__widget {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 枠1: 日経平均 -->
      <div class="chart-wrapper">
        <div class="custom-label">日経平均株価</div>
        <div class="watermark">日経平均</div>
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script
            type="text/javascript"
            src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
            async
          >
          {
            "symbols": [
              [
                "日経平均",
                "PEPPERSTONE:JPN225|1Y"
              ]
            ],
            "chartOnly": false,
            "width": "100%",
            "height": "100%",
            "locale": "ja",
            "colorTheme": "dark",
            "autosize": true,
            "showVolume": false,
            "showMA": false,
            "hideDateProperties": false,
            "hideMarketStatus": false,
            "hideSymbolLogo": false,
            "scalePosition": "right",
            "scaleMode": "Normal",
            "fontFamily": "Arial, sans-serif",
            "fontSize": "14",
            "noTimeScale": false,
            "valuesTracking": "1",
            "changeMode": "price-and-percent",
            "chartType": "area",
            "backgroundColor": "rgba(19, 23, 34, 0)"
          }
          </script>
        </div>
      </div>

  </body>
